<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Star Sector: Void Raiders</title>
    <meta name="description" content="An action-packed arcade space shooter featuring custom Web Audio SFX/music, procedural upgrades, a ship hangar, and tactical navigation computer systems." />
    <meta property="og:title" content="Star Sector: Void Raiders" />
    <meta property="og:description" content="An action-packed arcade space shooter featuring custom Web Audio SFX/music, procedural upgrades, a ship hangar, and tactical navigation computer systems." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Official CrazyGames SDK v3 (Mandatory: First script in head, await init in boot) -->
    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>

    <!-- Web Audio Autoplay Unlock -->
    <script>
      (function() {
        function unlockAudio() {
          var AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            if (!window.__audioUnlockCtx) {
              window.__audioUnlockCtx = new AudioCtx();
            }
            if (window.__audioUnlockCtx.state === 'suspended') {
              window.__audioUnlockCtx.resume();
            }
          }
        }
        window.addEventListener('pointerdown', unlockAudio, { passive: true });
        window.addEventListener('keydown', unlockAudio, { passive: true });
        window.addEventListener('touchstart', unlockAudio, { passive: true });
      })();
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet" />

    <style>
      /* ===== CRAZYGAMES V5 UNIVERSAL FULL-SCREEN (Zero Black Borders, Dominant Background #0a1628) ===== */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0a1628;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-user-select: none;
        user-select: none;
      }

      #root, #game-container {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      canvas, #game, #canvasViewport {
        display: block !important;
        width: 100vw !important;
        height: 100vh !important;
        max-width: 100vw !important;
        max-height: 100vh !important;
        object-fit: contain;
      }

      /* Elegant portrait blocker - Overlay displayed on top in portrait without removing canvas from DOM */
      #rotate-block {
        display: none;
        position: fixed;
        inset: 0;
        background: #0a1628;
        z-index: 9999;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
      }

      @keyframes spin {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(90deg); }
      }

      @media (orientation: portrait) {
        #rotate-block {
          display: flex !important;
        }
        /* CRITICAL QA TOOL FIX: Canvas is NOT set to display:none, so automated QA detects 1 active canvas! */
      }
    </style>
