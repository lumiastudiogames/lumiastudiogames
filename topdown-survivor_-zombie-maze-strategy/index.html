<!doctype html>
<html lang="en">
  <head>
    <script src="https://playgama.com/sdk/v2/bridge.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Topdown Survivor: Zombie Maze Strategy</title>

    <style>
      /* ===== UNIVERSAL FULL-SCREEN - FUNCIONA EM TODAS AS PLATAFORMAS ===== */
      * { margin:0; padding:0; box-sizing:border-box; }

      html, body {
        width:100%;
        height:100%;
        overflow:hidden;
        background:#07080d;
        display:flex;
        align-items:center;
        justify-content:center;
      }

      /* Container que segura seu jogo */
      #game-container {
        position:relative;
        width:100vw;
        height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
      }

      /* Seu canvas/jogo */
      canvas, #game, #game-wrapper, #root {
        display:block !important;
        width:100% !important;
        height:100% !important;
        max-width:100vw !important;
        max-height:100vh !important;
      }

      /* Para jogos que precisam manter 16:9 sem esticar */
      .aspect-16-9 {
        aspect-ratio:16/9;
        width:100%;
        height:auto;
        max-height:100vh;
        max-width:100vw;
      }

      /* BLOQUEADOR ELEGANTE - CRAZYGAMES / YANDEX / GD */
      #rotate-block { display:none !important;
        position:fixed;
        inset:0;
        background:#0a0a12;
        z-index:9999;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        text-align:center;
        color: #ffffff;
        font-family: monospace;
      }
      @keyframes spin {
        0%, 100% { transform:rotate(0deg); }
        50% { transform:rotate(90deg); }
      }
      /* Playgama allowed portrait */
    </style>

    <!-- Safe Auto-Scaler & Sound Unlock Guard -->
    <script>
      (function() {
        // Web Audio Autoplay Gesture Unlock
        function unlockAudio() {
          var AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            if (!window.__audioUnlockCtx) {
              window.__audioUnlockCtx = new AudioCtx();
            }
            if (window.__audioUnlockCtx.state === 'suspended') {
              window.__audioUnlockCtx.resume().catch(function(){});
            }
          }
        }
        window.addEventListener('pointerdown', unlockAudio, { passive: true });
        window.addEventListener('keydown', unlockAudio, { passive: true });
        window.addEventListener('touchstart', unlockAudio, { passive: true });

        // ===== RESPONSIVIDADE AUTOMÁTICA =====
        function resizeGame() {
          var container = document.getElementById('game-container');
          var root = document.getElementById('root');
          var ww = window.innerWidth;
          var wh = window.innerHeight;
          if (container) {
            container.style.width = ww + 'px';
            container.style.height = wh + 'px';
          }
          if (root) {
            root.style.width = ww + 'px';
            root.style.height = wh + 'px';
          }
        }

        window.addEventListener('resize', resizeGame);
        window.addEventListener('orientationchange', function() { setTimeout(resizeGame, 200); });
        document.addEventListener('DOMContentLoaded', resizeGame);
        resizeGame();
      })();
    </script>
