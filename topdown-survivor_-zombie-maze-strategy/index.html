<!doctype html>
<html lang="en">
  <head>
    <!-- Standalone SDK Mock & Auto-Scaler -->
    <script>
      (function() {
        try {
          Object.defineProperty(window, 'top', { get: function() { return window; }, configurable: true });
          Object.defineProperty(window, 'parent', { get: function() { return window; }, configurable: true });
        } catch(e) {}

        window.addEventListener('error', function(e) {
          if (e && e.message && (e.message.indexOf('file:') !== -1 || e.message.indexOf('Unsafe attempt') !== -1 || e.message.indexOf('security origins') !== -1)) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.CrazyGames = {
          SDK: {
            init: function() { return Promise.resolve(); },
            ad: { requestAd: function(type, callbacks) { if (callbacks && callbacks.adFinished) callbacks.adFinished(); } },
            game: { gameplayStart: function(){}, gameplayStop: function(){}, happytime: function(){} },
            user: { getUser: function() { return Promise.resolve(null); } }
          }
        };

        window.bridge = window.bridge || {
          init: function() { return Promise.resolve(); },
          platform: { id: 'standalone', language: 'en', tld: 'com', sendMessage: function() { return Promise.resolve(); } },
          advertisement: {
            showInterstitial: function() { return Promise.resolve(); },
            showRewarded: function() { return Promise.resolve(); },
            isBannerSupported: false,
            minimumDelayBetweenInterstitial: 0
          },
          social: { share: function() { return Promise.resolve(); }, isShareSupported: false },
          leaderboard: { setScore: function() { return Promise.resolve(); }, isSupported: false },
          player: { isAuthorizationSupported: false, isAuthorized: false, getData: function() { return Promise.resolve({}); }, setData: function() { return Promise.resolve(); } },
          storage: {
            isSupported: true,
            get: function(key) { return Promise.resolve(localStorage.getItem(key)); },
            set: function(key, val) { try { localStorage.setItem(key, val); } catch(e){} return Promise.resolve(); },
            delete: function(key) { try { localStorage.removeItem(key); } catch(e){} return Promise.resolve(); }
          },
          game: { visibilityState: 'visible' }
        };

        function autoScale() {
          var root = document.getElementById('root');
          if (!root) return;
          var winW = window.innerWidth;
          var winH = window.innerHeight;
          document.documentElement.style.margin = '0';
          document.documentElement.style.padding = '0';
          document.documentElement.style.width = '100%';
          document.documentElement.style.height = '100%';
          document.documentElement.style.overflow = 'hidden';
          document.body.style.margin = '0';
          document.body.style.padding = '0';
          document.body.style.width = '100%';
          document.body.style.height = '100%';
          document.body.style.overflow = 'hidden';
          document.body.style.display = 'flex';
          document.body.style.alignItems = 'center';
          document.body.style.justifyContent = 'center';
          var nativeW = 1000;
          var nativeH = 560;
          var scale = Math.min(winW / nativeW, winH / nativeH);
          if (scale < 1) {
            root.style.transform = 'scale(' + scale + ')';
            root.style.transformOrigin = 'center center';
          } else {
            root.style.transform = 'none';
          }
        }
        window.addEventListener('resize', autoScale);
        window.addEventListener('orientationchange', autoScale);
        document.addEventListener('DOMContentLoaded', autoScale);
        setInterval(autoScale, 600);
      })();
    </script>
