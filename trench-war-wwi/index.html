    <title>Trench War WWI</title>

    <script src="https://bridge.playgama.com/v2/stable/playgama-bridge.js"></script>
    <script>
      (function checkBridge() {
        if (typeof window !== 'undefined' && window.bridge && !window.__playgamaInitPromise) {
          console.log('[Playgama SDK v2] Immediate bridge detected -> calling bridge.initialize()...');
          window.__playgamaInitPromise = window.bridge.initialize()
            .then(function() {
              console.log('[Playgama SDK v2] bridge.initialize() success from head script');
              if (window.bridge.platform && typeof window.bridge.platform.sendMessage === 'function') {
                window.bridge.platform.sendMessage('game_ready');
              }
            })
            .catch(function(e) {
              console.warn('[Playgama SDK v2] bridge.initialize() notice:', e);
            });
        } else if (typeof window !== 'undefined' && !window.__playgamaInitPromise) {
          window.__bridgeAttempts = (window.__bridgeAttempts || 0) + 1;
          if (window.__bridgeAttempts < 300) {
            setTimeout(checkBridge, 100);
          }
        }
      })();
    </script>

    <style>
      /* ===== PLAYGAMA UNIVERSAL FULL-SCREEN ===== */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #080705;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #game-container {
        position: relative;
        width: 100vw !important;
        height: 100vh !important;
        display: flex !important;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      #root {
        width: 100% !important;
        height: 100% !important;
        display: flex !important;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
      }

      canvas, #gameCanvas {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: -moz-crisp-edges;
        image-rendering: -webkit-crisp-edges;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
    </style>

  <body class="bg-[#080705] text-[#f1e8d6] select-none overflow-hidden font-mono antialiased">
    <div id="game-container">
      <div id="root"></div>
    </div>

    <script>
      function resizeGame() {
        const container = document.getElementById('game-container');
        const root = document.getElementById('root');
        
        const ww = window.innerWidth || document.documentElement.clientWidth;
        const wh = window.innerHeight || document.documentElement.clientHeight;
        
        if (container) {
          container.style.width = ww + 'px';
          container.style.height = wh + 'px';
        }
        if (root) {
          root.style.width = ww + 'px';
          root.style.height = wh + 'px';
        }
      }

      window.addEventListener('resize', resizeGame);
      window.addEventListener('orientationchange', function() { setTimeout(resizeGame, 200); });
      document.addEventListener('fullscreenchange', resizeGame);
      document.addEventListener('webkitfullscreenchange', resizeGame);
      document.addEventListener('DOMContentLoaded', resizeGame);
      resizeGame();
    </script>
