<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Trench War WWI</title>

    <!-- CDN OFICIAL V2 PLAYGAMA BRIDGE -->
    <script src="https://bridge.playgama.com/v2/stable/playgama-bridge.js"></script>

    <script>
      // Wrapper para garantir inicializacao no QA Tool e plataformas Playgama
      window.__playgamaReady = (async function() {
        if (typeof window !== 'undefined' && window.bridge) {
          try {
            console.log("[Playgama SDK v2] Playgama Target Active - Initializing Bridge...");
            await window.bridge.initialize();
            console.log("[Playgama SDK v2] Bridge connected:", window.bridge.platform?.id || 'playgama');
            if (window.bridge.platform && window.bridge.platform.sendMessage) {
              window.bridge.platform.sendMessage('game_ready');
              console.log("[Playgama SDK v2] game_ready enviado");
            }
            return window.bridge;
          } catch (e) {
            console.warn("[Playgama SDK v2] Bridge init notice/offline fallback:", e);
            return null;
          }
        } else {
          console.warn("[Playgama SDK v2] Bridge not detected on window (offline fallback mode)");
          return null;
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=JetBrains+Mono:wght@400;700;900&family=Press+Start+2P&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
      /* ===== PLAYGAMA V5 UNIVERSAL FULL-SCREEN (LANDSCAPE & PORTRAIT PLAYABLE) ===== */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #080705;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #game-container, #root {
        width: 100vw !important;
        height: 100vh !important;
        max-width: 100vw !important;
        max-height: 100vh !important;
        display: flex !important;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
      }

      #gameCanvas, canvas {
        display: block !important;
        width: 100% !important;
        height: 100% !important;
        max-width: 100% !important;
        max-height: 100% !important;
        image-rendering: -moz-crisp-edges;
        image-rendering: -webkit-crisp-edges;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
    </style>

  <body class="bg-[#080705] text-[#f1e8d6] select-none overflow-hidden font-mono antialiased">
    <div id="game-container">
      <div id="root"></div>
    </div>

    <script>
      function resizeGame() {
        const ww = window.innerWidth;
        const wh = window.innerHeight;
        const container = document.getElementById('game-container');
        const root = document.getElementById('root');
        if (container) {
          container.style.width = ww + 'px';
          container.style.height = wh + 'px';
        }
        if (root) {
          root.style.width = ww + 'px';
          root.style.height = wh + 'px';
        }
      }
      window.addEventListener('resize', resizeGame);
      window.addEventListener('orientationchange', () => setTimeout(resizeGame, 200));
      resizeGame();
    </script>
