<!doctype html>
<html lang="en">
  <head>
    <!-- Standalone SDK Mock & Auto-Scaler Guard -->
    <script>
      (function() {
        try {
          Object.defineProperty(window, 'top', { get: function() { return window; }, configurable: true });
          Object.defineProperty(window, 'parent', { get: function() { return window; }, configurable: true });
        } catch(e) {}

        window.addEventListener('error', function(e) {
          if (e && e.message && (e.message.indexOf('file:') !== -1 || e.message.indexOf('Unsafe attempt') !== -1 || e.message.indexOf('security origins') !== -1)) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);

        // Web Audio Autoplay Gesture Unlock
        function unlockAudio() {
          var AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            if (!window.__audioUnlockCtx) {
              window.__audioUnlockCtx = new AudioCtx();
            }
            if (window.__audioUnlockCtx.state === 'suspended') {
              window.__audioUnlockCtx.resume();
            }
          }
        }
        window.addEventListener('pointerdown', unlockAudio, { once: false, passive: true });
        window.addEventListener('keydown', unlockAudio, { once: false, passive: true });
        window.addEventListener('touchstart', unlockAudio, { once: false, passive: true });

        window.CrazyGames = {
          SDK: {
            init: function() { return Promise.resolve(); },
            ad: { requestAd: function(type, callbacks) { if (callbacks && callbacks.adFinished) callbacks.adFinished(); } },
            game: { gameplayStart: function(){}, gameplayStop: function(){}, happytime: function(){} },
            user: { getUser: function() { return Promise.resolve(null); } }
          }
        };

        const dummyPromise = function() { return Promise.resolve(); };

        window.bridge = window.bridge || {
          init: dummyPromise,
          initialize: dummyPromise,
          on: function() {},
          off: function() {},
          subscribe: function() {},
          unsubscribe: function() {},
          platform: { id: 'standalone', language: 'en', tld: 'com', sendMessage: dummyPromise },
          advertisement: {
            showInterstitial: dummyPromise,
            showRewarded: dummyPromise,
            checkAdBlock: function() { return Promise.resolve(false); },
            isBannerSupported: false,
            minimumDelayBetweenInterstitial: 0
          },
          social: {
            share: dummyPromise,
            isShareSupported: false,
            isInviteFriendsSupported: false,
            isJoinCommunitySupported: false,
            isCreatePostSupported: false,
            isAddToHomeScreenSupported: false,
            isAddToFavoritesSupported: false,
            isRateSupported: false
          },
          leaderboard: {
            setScore: dummyPromise,
            getScore: function() { return Promise.resolve(0); },
            getEntries: function() { return Promise.resolve([]); },
            isSupported: false
          },
          player: {
            isAuthorizationSupported: false,
            isAuthorized: false,
            getData: function() { return Promise.resolve({}); },
            setData: dummyPromise
          },
          storage: {
            isSupported: true,
            get: function(key) { return Promise.resolve(localStorage.getItem(key)); },
            set: function(key, val) { try { localStorage.setItem(key, val); } catch(e){} return Promise.resolve(); },
            delete: function(key) { try { localStorage.removeItem(key); } catch(e){} return Promise.resolve(); }
          },
          game: { visibilityState: 'visible' }
        };

        function updateViewportMetrics() {
          var root = document.getElementById('root');
          if (!root) return;
          
          // Accurately calculate visible area considering mobile browser URL bar and bottom navigation buttons
          var vp = window.visualViewport;
          var winW = vp ? Math.round(vp.width) : window.innerWidth;
          var winH = vp ? Math.round(vp.height) : window.innerHeight;
          
          document.documentElement.style.margin = '0';
          document.documentElement.style.padding = '0';
          document.documentElement.style.width = '100%';
          document.documentElement.style.height = '100%';
          document.documentElement.style.overflow = 'hidden';
          document.documentElement.style.setProperty('--app-width', winW + 'px');
          document.documentElement.style.setProperty('--app-height', winH + 'px');
          
          document.body.style.margin = '0';
          document.body.style.padding = '0';
          document.body.style.width = '100%';
          document.body.style.height = '100%';
          document.body.style.overflow = 'hidden';
          
          root.style.width = '100%';
          root.style.height = winH + 'px';
          root.style.transform = 'none';
        }
        
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', updateViewportMetrics);
          window.visualViewport.addEventListener('scroll', updateViewportMetrics);
        }
        window.addEventListener('resize', updateViewportMetrics);
        window.addEventListener('orientationchange', updateViewportMetrics);
        document.addEventListener('DOMContentLoaded', updateViewportMetrics);
        setInterval(updateViewportMetrics, 1000);
      })();
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <style>
      html, body {
        margin:0; padding:0;
        width:100%; height:100%;
        background:#000;
        overflow:hidden;
      }
      canvas {
        display:block;
        width:100vw !important;
        height:100vh !important;
      }

      /* BLOQUEIO ELEGANTE TRAP CAVE */
      @media (orientation: portrait){
        #root, canvas{ display:none !important; }
        body{
          margin:0;
          background:#1a1a2e;
          display:flex;
          justify-content:center;
          align-items:center;
          min-height:100vh;
        }
        body::before{
          content:"";
          position:fixed; inset:0;
          background:
            url("data:image/svg+xml,%3Csvg width='120' height='80' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='120' height='80' fill='%231a1a2e'/%3E%3Cg opacity='0.5'%3E%3Cpath d='M0 40 H120' stroke='%231e1e38'/%3E%3Cpath d='M30 0 V40 M90 0 V40 M60 40 V80' stroke='%23222244'/%3E%3C/g%3E%3C/svg%3E"),
            radial-gradient(800px 500px at 50% 0%, rgba(245,166,35,0.12), transparent 60%);
        }
        body::after{
          content:"↻ ROTATE YOUR DEVICE\A\A This game is best experienced in landscape\A\A TRAP CAVE";
          white-space:pre-wrap;
          font: 900 26px ui-monospace, monospace;
          letter-spacing:0.08em;
          line-height:1.3;
          color:#f5a623;
          text-align:center;
          text-shadow:0 0 22px rgba(245,166,35,0.45);
          padding:32px;
          z-index:2;
          animation: fadeIn 0.6s ease;
        }
      }
      @keyframes fadeIn{
        from{ opacity:0; transform:translateY(8px) }
        to{ opacity:1; transform:none }
      }
