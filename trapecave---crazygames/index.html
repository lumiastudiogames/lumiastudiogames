        window.addEventListener('keydown', unlockAudio, { passive: true });

  <body class="bg-[#0e0714] text-white select-none overflow-hidden m-0 p-0 font-mono">
    <div id="root"></div>

    <script>
      function resizeGame() {
        var ww = window.innerWidth;
        var wh = window.innerHeight;
        var root = document.getElementById('root');
        if (root) {
          root.style.width = ww + 'px';
          root.style.height = wh + 'px';
        }
        document.documentElement.style.setProperty('--app-width', ww + 'px');
        document.documentElement.style.setProperty('--app-height', wh + 'px');
      }
      window.addEventListener('resize', resizeGame);
      window.addEventListener('orientationchange', function() { setTimeout(resizeGame, 200); });
      resizeGame();
    </script>
